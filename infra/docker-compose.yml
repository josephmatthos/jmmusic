services:
  postgres:
    image: postgres:17
    container_name: jm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jm_music
      POSTGRES_USER: jm
      POSTGRES_PASSWORD: jm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jm -d jm_music"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: jm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    image: rustfs/rustfs:latest
    container_name: jm_s3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: jmminio
      RUSTFS_SECRET_KEY: jmminio123
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3-setup:
    image: amazon/aws-cli:latest
    container_name: jm_s3_setup
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: jmminio
      AWS_SECRET_ACCESS_KEY: jmminio123
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://s3:9000 s3 mb s3://jm-music-private || true;
      echo 'Bucket jm-music-private pronto.';
      "

volumes:
  pgdata:
  s3data: